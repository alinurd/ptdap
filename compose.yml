name: ptdap

services:

  nginx:
    image: nginx:1.27-alpine
    container_name: ptdap-nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/logs:/var/log/nginx
    depends_on:
      - php
    networks:
      - project_net
      - infra_net

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: ptdap-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      DB_HOST: mysql8
      DB_PORT: 3306
      DB_DATABASE: ptdap
      DB_USERNAME: root
      DB_PASSWORD: Admin123
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - project_net
      - infra_net

  node:
    image: node:22-alpine
    container_name: ptdap-node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    profiles:
      - tools
    networks:
      - project_net

networks:
  project_net:
    driver: bridge
    name: ptdap_net
  infra_net:
    external: true
    name: infra_default
